<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress Vite HMR / WebSocket client connection errors per environment constraints (HMR: Disabled)
      (function() {
        function isViteHmrError(eventOrReason) {
          if (!eventOrReason) return false;
          const str = (
            String(eventOrReason.message || '') + ' ' +
            String(eventOrReason.filename || '') + ' ' +
            String(eventOrReason.stack || '') + ' ' +
            String(eventOrReason.reason?.message || '') + ' ' +
            String(eventOrReason.reason?.stack || '') + ' ' +
            String(eventOrReason)
          ).toLowerCase();
          return (
            str.includes('websocket') ||
            str.includes('@vite/client') ||
            str.includes('createwebsocketmodulerunnertransport') ||
            str.includes('modulerunner')
          );
        }

        window.addEventListener('error', function(event) {
          if (isViteHmrError(event) || isViteHmrError(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteHmrError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Intercept WebSocket constructor to silently catch connection failures in iframe preview
        try {
          const NativeWebSocket = window.WebSocket;
          if (NativeWebSocket) {
            window.WebSocket = function(url, protocols) {
              try {
                const ws = new NativeWebSocket(url, protocols);
                ws.addEventListener('error', function(err) {
                  if (typeof err?.stopImmediatePropagation === 'function') {
                    err.stopImmediatePropagation();
                  }
                });
                return ws;
              } catch (e) {
                const fallback = new EventTarget();
                fallback.close = function() {};
                fallback.send = function() {};
                fallback.readyState = 3;
                return fallback;
              }
            };
            window.WebSocket.prototype = NativeWebSocket.prototype;
            window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
            window.WebSocket.OPEN = NativeWebSocket.OPEN;
            window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
            window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
          }
        } catch (_) {}

        // GitHub Pages trailing slash normalization to prevent relative asset 404s
        try {
          var p = window.location.pathname;
          var h = window.location.hostname;
          if (h.endsWith('github.io') && p && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
            var url = window.location.protocol + '//' + window.location.host + p + '/' + window.location.search + window.location.hash;
            window.location.replace(url);
          }
        } catch (_) {}
      })();
    </script>
    <title>VividSync - Real-Time Lip-Sync Avatar Studio</title>
    <meta name="description" content="Photorealistic real-time lip-sync avatar generator with customizable emotions, live microphone input, and neural voice synthesis." />
    <meta property="og:title" content="VividSync - Real-Time Lip-Sync Avatar Studio" />
    <meta property="og:description" content="Photorealistic real-time lip-sync avatar generator with customizable emotions, live microphone input, and neural voice synthesis." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-neutral-800 selection:text-neutral-200">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0a0a0a; color: #e5e5e5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(255,255,255,0.12); border-top-color: #3b82f6; border-radius: 50%; animation: vivid-spin 0.9s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #f5f5f5;">VividSync Studio</div>
        <div style="font-size: 12px; color: #888888; margin-top: 4px;">Loading neural avatar engine...</div>
        <style>@keyframes vivid-spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>

      <div style="padding: 24px; text-align: center; color: #ffffff; background: #171717;">

      </div>
